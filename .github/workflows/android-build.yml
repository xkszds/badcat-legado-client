name: Android debug build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Run contract unit tests
        run: gradle --no-daemon :integration-contract:test

      - name: Verify pinned Legado Rhino artifact
        run: |
          artifact="third_party/maven/org/htmlunit/htmlunit-core-js/5.3.0-legado.4/htmlunit-core-js-5.3.0-legado.4.jar"
          if [ ! -f "$artifact" ]; then
            echo "::error title=Missing pinned Rhino JAR::Upload the exact Legado fork artifact at $artifact before assembling the APK."
            echo "Expected SHA-256: d240cdd66f5269ed33da53cde7e4e690cee6e162"
            exit 1
          fi
          echo "Found pinned Rhino artifact:"
          sha256sum "$artifact"
          echo "Expected SHA-256: d240cdd66f5269ed33da53cde7e4e690cee6e162"

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: badcat-legado-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
