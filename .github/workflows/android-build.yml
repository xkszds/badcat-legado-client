name: Android debug build

on:
  # Build once when code is pushed. The PR event duplicated every push build
  # for this long-running feature branch without adding a different artifact.
  push:
    branches: [ main, fix/favorites-search-ui, integration/legado-upstream-runtime ]
  workflow_dispatch:

# Give every pushed commit an independent concurrency group. GitHub Actions
# keeps at most one pending run per group, so a branch-only group silently
# replaces older pending commits instead of preserving their verification.
# Runner-capacity queuing remains visible as queued jobs on each run.
concurrency:
  group: badcat-android-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned upstream Legado source
        run: |
          expected="330e606c4d57e08adc056ff8ab7a4132c784da9a"
          actual="$(git -C upstream/legado rev-parse HEAD)"
          echo "Pinned Legado revision: $actual"
          test "$actual" = "$expected"
          test -f upstream/legado/LICENSE
          grep -q "GNU GENERAL PUBLIC LICENSE" upstream/legado/LICENSE

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure preinstalled Android SDK
        run: |
          : "${ANDROID_HOME:?GitHub runner Android SDK is not configured}"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$sdkmanager_path" ]; then
            echo "::error::Android SDK command-line tools were not found under $ANDROID_HOME"
            exit 1
          fi
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Run contract unit tests
        run: gradle --no-daemon :integration-contract:test

      - name: Run authentic Legado runtime model contract tests
        run: gradle --no-daemon :legado-runtime:testDebugUnitTest

      - name: Generate pinned Legado JavaScript API inventory
        run: |
          python3 -m py_compile .github/scripts/legado-js-abi-inventory.py
          python3 .github/scripts/legado-js-abi-inventory.py \
            --upstream-root upstream/legado/app/src/main/java \
            --host-root app/src/main/java \
            --output build/legado-js-abi-inventory.json

      - name: Upload pinned Legado JavaScript API inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legado-js-abi-inventory
          path: build/legado-js-abi-inventory.json
          if-no-files-found: warn
          retention-days: 14

      - name: Generate pinned Legado source dependency closure
        run: |
          python3 -m py_compile .github/scripts/legado-runtime-dependency-closure.py
          python3 .github/scripts/legado-runtime-dependency-closure.py --self-test
          python3 .github/scripts/legado-runtime-dependency-closure.py \
            --upstream-root upstream/legado \
            --output build/legado-runtime-dependency-closure.json

      - name: Upload pinned Legado source dependency closure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legado-runtime-dependency-closure
          path: build/legado-runtime-dependency-closure.json
          if-no-files-found: warn
          retention-days: 14

      - name: Restore pinned Legado Rhino artifact
        run: |
          upstream_commit="330e606c4d57e08adc056ff8ab7a4132c784da9"
          artifact="third_party/maven/org/htmlunit/htmlunit-core-js/5.3.0-legado.4/htmlunit-core-js-5.3.0-legado.4.jar"
          mkdir -p "$(dirname "$artifact")"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/LegadoTeam/legado/$upstream_commit/$artifact" \
            --output "$artifact"

      - name: Verify pinned Legado Rhino artifact
        run: |
          artifact="third_party/maven/org/htmlunit/htmlunit-core-js/5.3.0-legado.4/htmlunit-core-js-5.3.0-legado.4.jar"
          actual_size="$(wc -c < "$artifact" | tr -d " ")"
          actual_blob="$(git hash-object "$artifact")"
          echo "Artifact size: $actual_size bytes"
          echo "Git blob SHA-1: $actual_blob"
          test "$actual_size" = "1900654"
          test "$actual_blob" = "d240cdd66f5269ed33da53cde7e4e690cee6e162"

      - name: Restore pinned Legado Rhino extension sources
        run: |
          upstream_commit="330e606c4d57e08adc056ff8ab7a4132c784da9"
          upstream_root="modules/rhino/src/main/java/org/htmlunit/corejs/javascript"
          local_root="legado-rhino/src/main/java/org/htmlunit/corejs/javascript"
          files=(
            "ConcurrentNativeObject.java"
            "xmlimpl/Namespace.java"
            "xmlimpl/QName.java"
            "xmlimpl/XML.java"
            "xmlimpl/XMLLibImpl.java"
            "xmlimpl/XMLList.java"
            "xmlimpl/XMLLoaderImpl.java"
            "xmlimpl/XMLName.java"
            "xmlimpl/XMLObjectImpl.java"
            "xmlimpl/XMLWithScope.java"
            "xmlimpl/XmlNode.java"
            "xmlimpl/XmlProcessor.java"
          )
          for file in "${files[@]}"; do
            mkdir -p "$local_root/$(dirname "$file")"
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/LegadoTeam/legado/$upstream_commit/$upstream_root/$file" \
              --output "$local_root/$file"
          done

      - name: Verify G2d stage-1 authentic source manifest
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          manifest_path = pathlib.Path("legado-runtime-poc/source-closure-stage1.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = "330e606c4d57e08adc056ff8ab7a4132c784da9a"
          actual = subprocess.check_output(
              ["git", "-C", "upstream/legado", "rev-parse", "HEAD"], text=True
          ).strip()
          assert actual == expected == manifest["pinnedUpstream"]["commit"], (actual, expected)
          entries = manifest["sources"]
          paths = [entry["path"] for entry in entries]
          assert len(paths) == len(set(paths)), "duplicate source path in manifest"
          for entry in entries:
              path = pathlib.Path("upstream/legado") / entry["path"]
              assert path.is_file(), f"missing pinned source: {entry['path']}"
              blob = subprocess.check_output(
                  ["git", "-C", "upstream/legado", "hash-object", "--", entry["path"]], text=True
              ).strip()
              assert blob == entry["gitBlobSha1"], (entry["path"], blob, entry["gitBlobSha1"])
          print(f"Verified {len(entries)} authentic source blobs at {actual}")
          PY

      - name: Compile G2d stage-1 authentic rule/model source group
        run: |
          mkdir -p build/runtime-g2d-stage1
          cp legado-runtime-poc/source-closure-stage1.json build/runtime-g2d-stage1/
          set +e
          gradle --no-daemon :legado-runtime-poc:compileDebugKotlin > build/runtime-g2d-stage1/compiler.log 2>&1
          compile_status=$?
          set -e
          cat build/runtime-g2d-stage1/compiler.log
          printf '%s\n' "$compile_status" > build/runtime-g2d-stage1/exit-code.txt
          if [ "$compile_status" -eq 0 ]; then
            echo "G2D_STAGE1_RESULT=COMPILED_REQUIRES_CONTRACT_REVIEW"
          else
            echo "G2D_STAGE1_RESULT=COMPILER_DIAGNOSTICS_CAPTURED"
          fi

      - name: Upload G2d stage-1 compiler probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legado-runtime-g2d-stage1-probe
          path: build/runtime-g2d-stage1/**
          if-no-files-found: error
          retention-days: 14

      - name: Run bounded Rhino replacement host tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run real Android WebView provider instrumentation (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest
            test_status=$?
            mkdir -p build/runtime-2.3-webview
            adb exec-out run-as app.badcat.client cat files/runtime-2.3-webview-report.json > build/runtime-2.3-webview/runtime-2.3-webview-report.json 2>/dev/null
            capture_status=$?
            if [ "$capture_status" -ne 0 ]; then
              echo "WebView instrumentation report was not produced or could not be retrieved"
            else
              cat build/runtime-2.3-webview/runtime-2.3-webview-report.json
            fi
            exit "$test_status"
        env:
          ANDROID_I_WANT_MY_TCG: "yes"

      - name: Upload real WebView provider instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legado-webview-provider-runtime-2.3
          path: build/runtime-2.3-webview/**
          if-no-files-found: warn
          retention-days: 14

      - name: Capture compiled host JavaScript bridge JVM ABI
        if: always()
        run: |
          class_file="$(find app/build -type f -name 'RhinoSafeSourceJavaExtensions.class' -print -quit)"
          if [ -z "$class_file" ]; then
            echo "Compiled RhinoSafeSourceJavaExtensions.class was not produced"
            exit 1
          fi
          mkdir -p build/legado-host-jvm-abi
          javap -p -s -v "$class_file" > build/legado-host-jvm-abi/RhinoSafeSourceJavaExtensions.javap.txt
          sha256sum build/legado-host-jvm-abi/RhinoSafeSourceJavaExtensions.javap.txt | tee build/legado-host-jvm-abi/SHA256SUMS.txt

      - name: Upload compiled host JavaScript bridge JVM ABI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legado-host-jvm-abi
          path: build/legado-host-jvm-abi/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badcat-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            legado-runtime/build/reports/tests/testDebugUnitTest/**
            legado-runtime/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: badcat-legado-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Live smoke imported Nyasama source endpoints (best effort)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python3 -m pip install --quiet beautifulsoup4==4.13.4
          python3 - <<'PY'
          import gzip
          import ast
          import json
          import re
          import urllib.parse
          import urllib.request
          from bs4 import BeautifulSoup

          def simple_css(rule):
              rule = (rule or "").strip()
              if not rule or "<js>" in rule.lower() or "@js:" in rule.lower():
                  return None
              rule = rule.split("||", 1)[0].strip()
              rule = rule.replace("@", " ").replace("tag.", "")
              if rule.startswith("class."):
                  classes = rule[len("class."):].split()
                  rule = "." + ".".join(classes)
              if any(token in rule for token in ("{{", "!", "##", "&&")):
                  return None
              return rule

          collection_url = "https://shuyuan.nyasama.cc/shuyuan/12f348d3510bac0e5f1b164274f0b136.json"
          collection_request = urllib.request.Request(
              collection_url,
              headers={"Accept-Encoding": "identity", "User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(collection_request, timeout=10) as response:
              collection_body = response.read()
          if collection_body.startswith(b"\x1f\x8b"):
              collection_body = gzip.decompress(collection_body)
          sources = json.loads(collection_body.decode("utf-8-sig"))

          checks = [
              ("漫客栈", ["斗罗大陆", "一人之下", "海贼王"], lambda s: s.get("bookSourceUrl", "").startswith("http://comic.mkzhan.com") and "search/keyword/" in s.get("searchUrl", "")),
              ("漫客栈网页", ["斗罗大陆", "一人之下", "海贼王"], lambda s: s.get("bookSourceName") == "漫客栈" and "www.mkzhan.com/search/" in s.get("searchUrl", "")),
              ("酷我小说", ["斗破苍穹", "凡人修仙传", "道君"], lambda s: s.get("bookSourceName") == "酷我小说"),
              ("看漫画", ["海贼王", "某天成为王的女儿"], lambda s: s.get("bookSourceName") == "看漫画"),
              ("腾讯漫画", ["海贼王"], lambda s: s.get("bookSourceName") == "腾讯漫画"),
          ]

          failures = 0
          for name, keywords, predicate in checks:
              source = next((item for item in sources if predicate(item)), None)
              if source is None:
                  print(f"LIVE_FAIL {name}: source entry not found in collection")
                  failures += 1
                  continue

              base_url = source.get("bookSourceUrl", "").split("#", 1)[0]
              headers = json.loads(source.get("header") or "{}")
              if not isinstance(headers, dict):
                  headers = {}
              headers.setdefault("User-Agent", "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36")
              found = False
              for keyword in keywords:
                  url = source.get("searchUrl", "")
                  url = url.replace("{{key}}", urllib.parse.quote(keyword, safe=""))
                  url = url.replace("{{page}}", "1")
                  if url.startswith("/"):
                      url = urllib.parse.urljoin(base_url.rstrip("/") + "/", url.lstrip("/"))
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=10) as response:
                          body = response.read(1024 * 1024 + 1)
                          if response.status < 200 or response.status >= 300 or not body:
                              raise RuntimeError(f"HTTP {response.status}, {len(body)} bytes")
                          text_body = body.decode("utf-8", errors="replace")
                          rows = []
                          try:
                              payload = json.loads(body.decode("utf-8-sig"))
                              if name == "漫客栈":
                                  data = payload.get("data") or {}
                                  rows = data.get("list") or [] if isinstance(data, dict) else []
                              elif name == "酷我小说":
                                  rows = payload.get("data") or []
                              elif name == "看漫画":
                                  data = payload.get("data") or {}
                                  rows = (data.get("data") or []) if isinstance(data, dict) else data
                              if isinstance(rows, dict):
                                  rows = list(rows.values())
                              if not isinstance(rows, list):
                                  rows = []
                              print(
                                  f"LIVE_JSON {name}: code={payload.get('code')!r}, "
                                  f"message={payload.get('message')!r}, rows={len(rows)}, "
                                  f"paging={payload.get('paging')!r}, st={payload.get('st')!r}, "
                                  f"keys={list(payload)[:20]}"
                              )
                              if not rows:
                                  print(f"LIVE_EMPTY_BODY {name}: {text_body[:600]!r}")
                              if rows and isinstance(rows[0], dict):
                                  sample = {k: rows[0].get(k) for k in ("book_id", "title", "comic_id", "comic_name", "comic_author", "author_name") if k in rows[0]}
                                  print(f"LIVE_SAMPLE {name}: {sample!r}")
                              if name == "看漫画":
                                  names = [row.get("comic_name", "") for row in rows if isinstance(row, dict)]
                                  print(f"LIVE_NAMES {name}: {names[:14]!r}")
                          except (UnicodeDecodeError, json.JSONDecodeError, AttributeError):
                              pass

                          if name == "腾讯漫画":
                              found = ("航海王" in text_body or "海贼王" in text_body) and "<html" in text_body.lower()
                              if found:
                                  print(f"LIVE_OK {name}: keyword={keyword}, HTML result confirmed, {len(body)} bytes")
                          elif name == "漫客栈网页":
                              found = "<html" in text_body.lower() and keyword in text_body
                              if found:
                                  print(f"LIVE_OK {name}: keyword={keyword}, HTML keyword result confirmed, {len(body)} bytes")
                              else:
                                  print(f"LIVE_EMPTY {name}: keyword={keyword}, HTML={ '<html' in text_body.lower() }, {len(body)} bytes")
                          elif name == "看漫画":
                              names = [row.get("comic_name", "") for row in rows if isinstance(row, dict)]
                              found = any(keyword in title for title in names)
                              if found:
                                  print(f"LIVE_OK {name}: keyword={keyword}, matching title found, rows={len(rows)}")
                              else:
                                  print(f"LIVE_EMPTY {name}: keyword={keyword}, rows={len(rows)} but no title match")
                          elif rows:
                              found = True
                              print(f"LIVE_OK {name}: keyword={keyword}, rows={len(rows)}, HTTP {response.status}, {len(body)} bytes")
                          else:
                              print(f"LIVE_EMPTY {name}: keyword={keyword}, HTTP {response.status}, {len(body)} bytes")
                          if found:
                              break
                  except Exception as error:
                      print(f"LIVE_FAIL_ATTEMPT {name}: keyword={keyword}: {type(error).__name__}: {error}")
              if not found:
                  failures += 1
                  print(f"LIVE_FAIL {name}: no result rows for tested keywords {keywords}")

          print(f"Nyasama live source search: {len(checks) - failures}/{len(checks)} returned usable results")

          # Expand coverage beyond the four named regression sources. Probe a
          # bounded sample of other enabled HTTP sources without assuming that
          # a non-empty HTTP body means parsed book results.
          excluded = {"漫客栈", "酷我小说", "看漫画", "腾讯漫画"}
          sampled = 0
          for source in sources:
              name = source.get("bookSourceName", "未命名书源")
              search_url = source.get("searchUrl", "")
              base_url = source.get("bookSourceUrl", "").split("#", 1)[0]
              if name in excluded or not search_url or not search_url.startswith(("http://", "https://", "/")):
                  continue
              if source.get("enabled") is False:
                  continue
              url = search_url.replace("{{key}}", urllib.parse.quote("斗罗大陆", safe=""))
              url = url.replace("{{page}}", "1")
              if url.startswith("/"):
                  url = urllib.parse.urljoin(base_url.rstrip("/") + "/", url.lstrip("/"))
              if not url.startswith(("http://", "https://")):
                  continue
              sampled += 1
              if sampled > 5:
                  break
              headers = {}
              try:
                  raw_headers = json.loads(source.get("header") or "{}")
                  if isinstance(raw_headers, dict):
                      headers.update(raw_headers)
              except Exception:
                  pass
              headers.setdefault("User-Agent", "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36")
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=6) as response:
                      body = response.read(256 * 1024 + 1)
                      preview = body[:180].decode("utf-8", errors="replace").replace("\\n", " ")
                      if response.status == 200 and len(body) > 0:
                          print(f"EXTRA_HTTP {sampled:02d} {name}: HTTP {response.status}, {len(body)} bytes, preview={preview!r}")
                      else:
                          print(f"EXTRA_EMPTY {sampled:02d} {name}: HTTP {response.status}, {len(body)} bytes")
              except Exception as error:
                  print(f"EXTRA_FAIL {sampled:02d} {name}: {type(error).__name__}: {error}")
          print(f"Additional enabled source endpoints probed: {min(sampled, 5)}")
          raise SystemExit(1 if failures else 0)
          PY

      - name: Probe public Legado source repositories (best effort)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from bs4 import BeautifulSoup

          def selector_part(part):
              raw_tokens = part.strip().split()
              index = None
              # Legado's class.foo bar baz means one element carrying all
              # three classes, not a descendant chain. Keep the smoke parser
              # aligned with CssRuleEvaluator's compound-class semantics.
              if raw_tokens and raw_tokens[0].startswith("class.") and len(raw_tokens) > 1:
                  class_names = [raw_tokens[0][len("class."):], *raw_tokens[1:]]
                  if all(re.fullmatch(r"[A-Za-z0-9_-]+", name) for name in class_names):
                      return "".join("." + name for name in class_names), None
              tokens = []
              for token in raw_tokens:
                  if token.startswith("class."):
                      token = "." + token[len("class."):]
                  elif token.startswith("tag."):
                      token = token[len("tag."):]
                  match = re.search(r"\.(-?\d+)$", token)
                  if match:
                      index = int(match.group(1))
                      token = token[:match.start()]
                  tokens.append(token)
              return " ".join(tokens), index

          multi_class_css, multi_class_index = selector_part("class.foo bar baz")
          assert multi_class_css == ".foo.bar.baz" and multi_class_index is None, (multi_class_css, multi_class_index)
          fixture = BeautifulSoup('<div class="foo bar baz"></div><div class="foo bar"></div>', "html.parser")
          assert len(fixture.select(multi_class_css)) == 1, "multi-class selector must match only the element carrying every class"
          print("PUBLIC_SELECTOR_SELF_TEST multi-class Legado class selector: PASS")

          def simple_css(rule):
              rule = (rule or "").strip()
              if not rule or "<js>" in rule.lower() or "@js:" in rule.lower():
                  return None
              if any(token in rule for token in ("{{", "!", "##", "&&", "||")):
                  return None
              if rule.lower().startswith("@css:"):
                  rule = rule[5:].strip()
              first = rule.split("@", 1)[0].strip()
              selector, _ = selector_part(first)
              return selector or None

          def legado_field(node, rule):
              parts = [part.strip() for part in (rule or "").split("@") if part.strip()]
              current = [node]
              for part in parts:
                  mode = part.lower()
                  if mode in {"text", "owntext", "textnodes", "html", "href", "src", "content", "tag"}:
                      values = []
                      for item in current:
                          if mode == "text":
                              values.append(item.get_text(" ", strip=True))
                          elif mode == "owntext":
                              values.append(" ".join(item.find_all(string=True, recursive=False)).strip())
                          elif mode == "textnodes":
                              values.append(" ".join(item.find_all(string=True)).strip())
                          elif mode == "html":
                              values.append(str(item))
                          elif mode == "tag":
                              values.append(item.name or "")
                          else:
                              values.append(item.get(mode, ""))
                      return next((value for value in values if value), None)
                  selector, index = selector_part(part)
                  selected = []
                  for item in current:
                      selected.extend(item.select(selector) if selector else [item])
                  if index is not None:
                      selected = [selected[index]] if -len(selected) <= index < len(selected) else []
                  current = selected
              return current[0].get_text(" ", strip=True) if current else None

          collections = [
              ("liufuyou-yck", "https://raw.githubusercontent.com/liufuyou/read/main/sources/yck-novel.json"),
              ("liufuyou-yiove", "https://raw.githubusercontent.com/liufuyou/read/main/sources/yiove-novel.json"),
              ("cjj-curated", "https://raw.githubusercontent.com/cjj200011222/legado-booksource/master/all.json"),
              # A small, separately maintained public source set with known static
              # POST descriptors; used only for bounded live POST compatibility probes.
              ("XIU2-Yuedu", "https://raw.githubusercontent.com/XIU2/Yuedu/master/shuyuan"),
          ]
          sources = []
          for label, url in collections:
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Badcat-Legado-Compatibility-Test/1.0"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read(15 * 1024 * 1024 + 1)
                  if len(raw) > 15 * 1024 * 1024:
                      raise RuntimeError("collection exceeds 15 MiB safety limit")
                  data = json.loads(raw.decode("utf-8-sig"))
                  if isinstance(data, dict):
                      data = [data]
                  if not isinstance(data, list):
                      raise ValueError("collection root is not an array")
                  print(f"PUBLIC_COLLECTION {label}: {len(data)} entries")
                  for item in data:
                      if isinstance(item, dict):
                          item = dict(item)
                          item["_collection"] = label
                          sources.append(item)
              except Exception as error:
                  print(f"PUBLIC_COLLECTION_FAIL {label}: {type(error).__name__}: {error}")

          # Keep this first sweep to ordinary GET sources. JS-generated, POST,
          # login/signature-dependent and opaque data: URLs need the Legado
          # runtime and are intentionally not misrepresented as HTTP tests.
          preferred = [
              "天天看书", "篱笆文学", "幻梦轻说", "天天小说", "猫眼看书",
              "鲸云轻说", "轻之文库", "茶马小说", "阅读库子", "穿越小说",
              "书荒网", "错层小说网", "笔趣阁", "品书斋",
          ]
          selected = []
          seen = set()
          for wanted in preferred:
              for source in sources:
                  name = source.get("bookSourceName", "")
                  search = source.get("searchUrl", "")
                  if wanted not in name or source.get("enabled") is False:
                      continue
                  if not isinstance(search, str) or not search or search.startswith("@js:") or search.startswith("{{"):
                      continue
                  if "method" in search.lower() or "data:;base64" in search.lower() or "{{" in search.replace("{{key}}", "").replace("{{page}}", ""):
                      continue
                  if not source.get("ruleSearch", {}).get("bookList"):
                      continue
                  identity = (source.get("_collection"), name, source.get("bookSourceUrl"), search)
                  if identity in seen:
                      continue
                  seen.add(identity)
                  selected.append(source)
                  break
              if len(selected) >= 14:
                  break

          usable_http = 0
          for index, source in enumerate(selected, 1):
              name = source.get("bookSourceName", "未命名")
              collection = source.get("_collection", "unknown")
              base = source.get("bookSourceUrl", "").split("#", 1)[0].strip()
              search = source.get("searchUrl", "")
              url = search.replace("{{key}}", urllib.parse.quote("斗罗大陆", safe="")).replace("{{page}}", "1")
              if url.startswith("/"):
                  url = urllib.parse.urljoin(base.rstrip("/") + "/", url.lstrip("/"))
              elif not url.startswith(("http://", "https://")):
                  url = urllib.parse.urljoin(base.rstrip("/") + "/", url)
              headers = {"User-Agent": "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"}
              try:
                  raw_headers = json.loads(source.get("header") or "{}")
                  if isinstance(raw_headers, dict):
                      headers.update(raw_headers)
              except Exception:
                  pass
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=18) as response:
                      body = response.read(1024 * 1024 + 1)
                      text_body = body[:1024 * 1024].decode("utf-8", errors="replace")
                      if response.status == 200 and body:
                          usable_http += 1
                      keyword_hit = "斗罗大陆" in text_body
                      link_count = text_body.lower().count("<a ")
                      list_rule = source.get("ruleSearch", {}).get("bookList", "")
                      list_css = simple_css(list_rule)
                      name_rule = source.get("ruleSearch", {}).get("name", "")
                      url_rule = source.get("ruleSearch", {}).get("bookUrl", "")
                      name_css = simple_css(name_rule)
                      selected_count = 0
                      extracted_count = 0
                      valid_url_count = 0
                      matching_titles = []
                      if text_body.lstrip().startswith(("{", "[")):
                          try:
                              payload_for_rows = json.loads(text_body)
                              print(f"PUBLIC_SOURCE_JSON {name}: root={type(payload_for_rows).__name__}, keys={list(payload_for_rows)[:10] if isinstance(payload_for_rows, dict) else 'array'}")
                          except Exception:
                              pass
                      elif list_css:
                          try:
                              soup = BeautifulSoup(text_body, "html.parser")
                              result_nodes = soup.select(list_css)
                              selected_count = len(result_nodes)
                              for node in result_nodes[:100]:
                                  title = legado_field(node, name_rule)
                                  book_url = legado_field(node, url_rule)
                                  if title:
                                      extracted_count += 1
                                      if "斗罗大陆" in title:
                                          matching_titles.append(title[:100])
                                  if book_url and (book_url.startswith("/") or book_url.startswith("http://") or book_url.startswith("https://")):
                                      valid_url_count += 1
                              print(f"PUBLIC_SOURCE_CSS {name}: list_rule={list_rule!r}, name_rule={name_rule!r}, bookUrl_rule={url_rule!r}, selector={list_css!r}, items={selected_count}, extracted_names={extracted_count}, valid_book_urls={valid_url_count}, matching_titles={matching_titles[:5]!r}")
                          except Exception as parse_error:
                              print(f"PUBLIC_SOURCE_CSS_FAIL {name}: {type(parse_error).__name__}: {parse_error}")
                      json_keys = []
                      json_rows = 0
                      try:
                          payload = json.loads(text_body)
                          if isinstance(payload, dict):
                              json_keys = list(payload)[:12]
                              for value in payload.values():
                                  if isinstance(value, list):
                                      json_rows = max(json_rows, len(value))
                                  elif isinstance(value, dict):
                                      for nested in value.values():
                                          if isinstance(nested, list):
                                              json_rows = max(json_rows, len(nested))
                      except Exception:
                          pass
                      print(
                          f"PUBLIC_SOURCE_HTTP {index:02d} [{collection}] {name}: "
                          f"HTTP {response.status}, {len(body)} bytes, keyword_hit={keyword_hit}, "
                          f"html_links={link_count}, json_rows_shallow={json_rows}, keys={json_keys!r}"
                      )
                      if not body:
                          print(f"PUBLIC_SOURCE_EMPTY {name}: empty response body")
              except Exception as error:
                  print(f"PUBLIC_SOURCE_FAIL {index:02d} [{collection}] {name}: {type(error).__name__}: {error}")

          # Probe a few real, static POST descriptors using Legado's
          # "URL,{JSON-or-Python-dict-options}" syntax. Dynamic @js/<js>
          # descriptors are deliberately excluded: they require the bounded
          # Android Rhino runtime and must not be approximated here.
          def parse_static_request_descriptor(search_url):
              match = re.search(r",\s*(?=\{)", search_url)
              if not match:
                  return search_url.strip(), {}
              endpoint = search_url[:match.start()].strip()
              raw_options = search_url[match.end():].strip()
              try:
                  options = json.loads(raw_options)
              except json.JSONDecodeError:
                  options = ast.literal_eval(raw_options)
              if not isinstance(options, dict):
                  raise ValueError("Legado URL options are not an object")
              return endpoint, options

          post_preferred = ["69书吧", "艾途小说", "武林中文网"]
          post_sources = []
          seen_post = set()
          for wanted in post_preferred:
              for source in sources:
                  name = source.get("bookSourceName", "")
                  search = source.get("searchUrl", "")
                  if name != wanted or source.get("enabled") is False:
                      continue
                  if not isinstance(search, str) or not search or "@js" in search.lower() or "<js>" in search.lower():
                      continue
                  if not source.get("ruleSearch", {}).get("bookList"):
                      continue
                  try:
                      endpoint, options = parse_static_request_descriptor(search)
                  except Exception:
                      continue
                  if str(options.get("method", "GET")).upper() != "POST":
                      continue
                  identity = (source.get("_collection"), name, source.get("bookSourceUrl"), search)
                  if identity not in seen_post:
                      seen_post.add(identity)
                      post_sources.append((source, endpoint, options))
                  break

          post_success = 0
          for index, (source, endpoint, options) in enumerate(post_sources, 1):
              name = source.get("bookSourceName", "未命名")
              base = source.get("bookSourceUrl", "").split("#", 1)[0].strip()
              keyword = "斗罗大陆"
              url = endpoint.replace("{{key}}", urllib.parse.quote(keyword, safe="")).replace("{{page}}", "1")
              if url.startswith("/"):
                  url = urllib.parse.urljoin(base.rstrip("/") + "/", url.lstrip("/"))
              elif not url.startswith(("http://", "https://")):
                  url = urllib.parse.urljoin(base.rstrip("/") + "/", url)
              charset = options.get("charset") or "utf-8"
              try:
                  keyword_encoded = urllib.parse.quote_from_bytes(keyword.encode(charset), safe="")
                  body_template = options.get("body")
                  if body_template is None:
                      raise ValueError("POST descriptor has no body")
                  if not isinstance(body_template, str):
                      body_template = json.dumps(body_template, ensure_ascii=False, separators=(",", ":"))
                  body_text = body_template.replace("{{key}}", keyword_encoded).replace("{{page}}", "1")
                  body_bytes = body_text.encode(charset)
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  }
                  option_headers = options.get("headers") or {}
                  if isinstance(option_headers, dict):
                      headers.update({str(k): str(v) for k, v in option_headers.items()})
                  if not any(k.lower() == "content-type" for k in headers):
                      headers["Content-Type"] = f"application/x-www-form-urlencoded; charset={charset}"
                  if not any(k.lower() == "referer" for k in headers):
                      headers["Referer"] = base.rstrip("/") + "/"
                  request = urllib.request.Request(url, data=body_bytes, headers=headers, method="POST")
                  with urllib.request.urlopen(request, timeout=18) as response:
                      raw_body = response.read(1024 * 1024 + 1)
                      if len(raw_body) > 1024 * 1024:
                          raise RuntimeError("response exceeds 1 MiB safety limit")
                      response_text = raw_body.decode(charset, errors="replace")
                      status = response.status
                  list_rule = source.get("ruleSearch", {}).get("bookList", "")
                  name_rule = source.get("ruleSearch", {}).get("name", "")
                  url_rule = source.get("ruleSearch", {}).get("bookUrl", "")
                  selector = simple_css(list_rule)
                  items = []
                  names = []
                  valid_urls = 0
                  if selector and response_text.strip().startswith("<"):
                      soup = BeautifulSoup(response_text, "html.parser")
                      items = soup.select(selector)
                      for node in items[:100]:
                          title = legado_field(node, name_rule)
                          book_url = legado_field(node, url_rule)
                          if title:
                              names.append(title[:100])
                          if book_url and (book_url.startswith("/") or book_url.startswith("http://") or book_url.startswith("https://")):
                              valid_urls += 1
                  keyword_hits = [title for title in names if keyword in title]
                  print(
                      f"PUBLIC_SOURCE_POST {index:02d} {name}: HTTP {status}, "
                      f"bytes={len(raw_body)}, charset={charset}, items={len(items)}, "
                      f"extracted_names={len(names)}, valid_book_urls={valid_urls}, "
                      f"keyword_hits={keyword_hits[:5]!r}"
                  )
                  if status == 200 and items and names and valid_urls:
                      post_success += 1
                  else:
                      print(f"PUBLIC_SOURCE_POST_INCOMPLETE {name}: HTTP success alone is not a parsed book result")
              except Exception as error:
                  print(f"PUBLIC_SOURCE_POST_FAIL {index:02d} {name}: {type(error).__name__}: {error}")

          print(f"Public static POST source probe: {len(post_sources)} attempted, {post_success} returned parsed list entries with names and valid book URLs")
          print(f"Public source endpoint sweep: {len(selected)} GET attempted, {usable_http} non-empty HTTP 200 responses")
          print("NOTE: GET/POST smoke checks validate bounded search-list extraction only, not the complete Legado JS/rule pipeline.")
          PY

      - name: Live end-to-end imported Feisuzhong source reading (best effort)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .github/scripts/live-bixiange-reading-smoke.py 2>&1 | tee live-bixiange-reading-smoke.log

      - name: Live end-to-end maintained Pinshuzhai source reading (best effort)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .github/scripts/live-pinshuzhai-reading-smoke.py 2>&1 | tee live-pinshuzhai-reading-smoke.log

      - name: Upload Pinshuzhai live source smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badcat-pinshuzhai-live-source-smoke-report
          path: live-pinshuzhai-reading-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload live source smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badcat-live-source-smoke-report
          path: live-bixiange-reading-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Live end-to-end sample of four uploaded-corpus sources (best effort)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python3 -m pip install --quiet beautifulsoup4==4.13.4
          set -o pipefail
          python3 .github/scripts/live-uploaded-source-reading-smoke.py 2>&1 | tee live-uploaded-source-reading-smoke.log

      - name: Upload uploaded-corpus live reading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badcat-uploaded-corpus-live-reading-report
          path: live-uploaded-source-reading-smoke.log
          if-no-files-found: ignore
          retention-days: 7
