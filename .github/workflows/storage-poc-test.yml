name: Isolated storage PoC tests

on:
  push:
    branches:
      - storage-poc/026CZ

permissions:
  contents: read

concurrency:
  group: storage-poc-test-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  storage-poc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
    steps:
      - name: Check out exact source and pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Preflight runner capacity before Gradle
        shell: bash
        run: |
          set -euo pipefail
          out="build/storage-poc-proof"
          mkdir -p "$out"
          mem_total_kib="$(awk '$1 == "MemTotal:" {print $2}' /proc/meminfo)"
          mem_available_kib="$(awk '$1 == "MemAvailable:" {print $2}' /proc/meminfo)"
          effective_limit_bytes=$((mem_total_kib * 1024))
          cgroup_limit="unlimited"
          if [[ -r /sys/fs/cgroup/memory.max ]]; then
            raw_limit="$(cat /sys/fs/cgroup/memory.max)"
            if [[ "$raw_limit" =~ ^[0-9]+$ ]]; then
              cgroup_limit="$raw_limit"
              if (( raw_limit < effective_limit_bytes )); then effective_limit_bytes="$raw_limit"; fi
            fi
          elif [[ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ]]; then
            raw_limit="$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)"
            if [[ "$raw_limit" =~ ^[0-9]+$ ]] && (( raw_limit < 1000000000000000 )); then
              cgroup_limit="$raw_limit"
              if (( raw_limit < effective_limit_bytes )); then effective_limit_bytes="$raw_limit"; fi
            fi
          fi
          cpu_count="$(nproc)"
          {
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "RUNNER_OS=$RUNNER_OS"
            echo "RUNNER_ARCH=$RUNNER_ARCH"
            echo "MEM_TOTAL_BYTES=$((mem_total_kib * 1024))"
            echo "MEM_AVAILABLE_BYTES=$((mem_available_kib * 1024))"
            echo "CGROUP_MEMORY_LIMIT_BYTES=$cgroup_limit"
            echo "EFFECTIVE_MEMORY_LIMIT_BYTES=$effective_limit_bytes"
            echo "CPU_COUNT=$cpu_count"
          } | tee "$out/runner-capacity.txt"
          if (( effective_limit_bytes < 8589934592 || mem_available_kib * 1024 < 8589934592 || cpu_count < 4 )); then
            echo "CAPACITY_GATE=FAIL (requires >=8 GiB effective and available RAM, >=4 vCPU)" | tee -a "$out/runner-capacity.txt"
            exit 78
          fi
          echo "CAPACITY_GATE=PASS" | tee -a "$out/runner-capacity.txt"

      - name: Verify exact source and pinned Legado identity
        shell: bash
        run: |
          set -euo pipefail
          expected="330e606c4d57e08adc056ff8ab7a4132c784da9a"
          actual="$(git -C upstream/legado rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$actual" = "$expected"
          test -f upstream/legado/LICENSE
          grep -q "GNU GENERAL PUBLIC LICENSE" upstream/legado/LICENSE
          test -z "$(git -C upstream/legado status --porcelain)"
          {
            echo "BADCAT_COMMIT=$GITHUB_SHA"
            echo "LEGADO_COMMIT=$actual"
            echo "LEGADO_WORKTREE=CLEAN"
          } | tee build/storage-poc-proof/source-identity.txt

      - name: Stage exact pinned HtmlUnit CoreJS Maven artifact
        shell: bash
        run: |
          set -euo pipefail
          source="upstream/legado/third_party/maven/org/htmlunit/htmlunit-core-js/5.3.0-legado.4/htmlunit-core-js-5.3.0-legado.4.jar"
          target="third_party/maven/org/htmlunit/htmlunit-core-js/5.3.0-legado.4/htmlunit-core-js-5.3.0-legado.4.jar"
          pom="third_party/maven/org/htmlunit/htmlunit-core-js/5.3.0-legado.4/htmlunit-core-js-5.3.0-legado.4.pom"
          license="upstream/legado/app/src/main/assets/licenses/htmlunit-core-js/5.3.0-legado.4/LICENSE-core-js.txt"
          expected="d720f34285515025e4ccc80a5b92aed42cb26c03a7715ca53583d2c74ae51df7"
          test -f "$source"
          test -f "$pom"
          test -f "$license"
          source_sha="$(sha256sum "$source" | awk '{print $1}')"
          test "$source_sha" = "$expected"
          mkdir -p "$(dirname "$target")"
          cp -- "$source" "$target"
          target_sha="$(sha256sum "$target" | awk '{print $1}')"
          test "$target_sha" = "$expected"
          cmp -s "$pom" "upstream/legado/third_party/maven/org/htmlunit/htmlunit-core-js/5.3.0-legado.4/htmlunit-core-js-5.3.0-legado.4.pom"
          {
            echo "MAVEN_COORDINATE=org.htmlunit:htmlunit-core-js:5.3.0-legado.4"
            echo "SOURCE=$source"
            echo "TARGET=$target"
            echo "SOURCE_SHA256=$source_sha"
            echo "TARGET_SHA256=$target_sha"
            echo "POM_SHA256=$(sha256sum "$pom" | awk '{print $1}')"
            echo "LICENSE_SHA256=$(sha256sum "$license" | awk '{print $1}')"
            echo "ARTIFACT_BYTES=$(stat -c '%s' "$target")"
          } | tee build/storage-poc-proof/pinned-artifacts.txt

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK platform 36
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is not configured}"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_path"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up isolated Gradle 8.14.4
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.4'
          cache-disabled: true

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "BADCAT_COMMIT=$GITHUB_SHA"
            java -version 2>&1
            gradle --version
            sdkmanager --list_installed
          } > build/storage-poc-proof/toolchain.txt 2>&1
          cat build/storage-poc-proof/toolchain.txt

      - name: Run isolated storage PoC unit tests
        shell: bash
        run: |
          set -euo pipefail
          log="build/storage-poc-proof/testDebugUnitTest.log"
          if ! gradle --no-daemon --no-build-cache --no-configuration-cache --console plain --stacktrace \
            :legado-runtime-poc:testDebugUnitTest > "$log" 2>&1; then
            tail -n 220 "$log"
            exit 1
          fi
          tail -n 80 "$log"
          if grep -hE '^> Task :(app|integration-contract):' "$log"; then
            echo "An out-of-scope production module task executed." >&2
            exit 1
          fi

      - name: Summarize JUnit results and hash evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          paths = sorted(glob.glob('legado-runtime-poc/build/test-results/testDebugUnitTest/TEST-*.xml'))
          totals = {'suites': 0, 'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in paths:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              for suite in suites:
                  totals['suites'] += 1
                  for key in ('tests', 'failures', 'errors', 'skipped'):
                      totals[key] += int(suite.attrib.get(key, 0))
          with open('build/storage-poc-proof/junit-summary.txt', 'w') as out:
              out.write('JUNIT_XML_FILES=%d\n' % len(paths))
              for key, value in totals.items(): out.write('%s=%d\n' % (key.upper(), value))
          print(open('build/storage-poc-proof/junit-summary.txt').read(), end='')
          PY
          find build/storage-poc-proof legado-runtime-poc/build/test-results/testDebugUnitTest \
            legado-runtime-poc/build/reports/tests/testDebugUnitTest \
            legado-runtime-poc/build/generated/source/apt legado-runtime-poc/build/tmp/kapt3 \
            -type f -print 2>/dev/null | sort > build/storage-poc-proof/evidence-files.txt || true
          while IFS= read -r file; do test ! -f "$file" || sha256sum "$file"; done \
            < build/storage-poc-proof/evidence-files.txt > build/storage-poc-proof/SHA256SUMS

      - name: Upload isolated storage PoC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-poc-test-evidence
          path: |
            build/storage-poc-proof/**
            legado-runtime-poc/build/test-results/testDebugUnitTest/**
            legado-runtime-poc/build/reports/tests/testDebugUnitTest/**
            legado-runtime-poc/build/generated/source/apt/**
            legado-runtime-poc/build/tmp/kapt3/**
          if-no-files-found: warn
          retention-days: 30
